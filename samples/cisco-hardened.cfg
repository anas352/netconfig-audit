version 15.2
service password-encryption
hostname core-rtr
!
aaa new-model
enable algorithm-type scrypt secret 9 $9$EXAMPLEONLY$notarealhash
username netadmin privilege 15 algorithm-type scrypt secret 9 $9$EXAMPLEONLY$notarealhash
!
no ip http server
no ip http secure-server
ip ssh version 2
no cdp run
!
interface GigabitEthernet0/0
 ip address 203.0.113.6 255.255.255.252
!
ip access-list standard MGMT
 permit 10.99.0.0 0.0.0.255
ip access-list standard SNMP-ACL
 permit 10.99.0.10
!
snmp-server community Xk9-mon-2026 RO SNMP-ACL
logging host 10.99.0.20
ntp server 10.99.0.1
!
banner login ^C Authorized access only ^C
!
line con 0
 exec-timeout 10 0
line vty 0 4
 access-class MGMT in
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 access-class MGMT in
 exec-timeout 10 0
 transport input ssh
!
end
